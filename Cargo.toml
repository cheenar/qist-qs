[package]
name = "qs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "qist — quick list. A native, terminal-aware directory lister for macOS and Linux."
license = "MIT"
default-run = "qs"

[[bin]]
name = "qs"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
